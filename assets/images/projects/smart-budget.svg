<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots2" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#34D399" opacity="0.18"/>
    </pattern>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="#0F172A"/>
  <rect width="400" height="280" fill="url(#dots2)"/>

  <!-- phone silhouette -->
  <rect x="150" y="30" width="100" height="220" rx="18" fill="#000" stroke="#1E293B" stroke-width="2"/>
  <rect x="158" y="46" width="84" height="188" rx="10" fill="url(#grad)" stroke="#34D399" stroke-width="1"/>
  <rect x="180" y="30" width="40" height="10" rx="5" fill="#000"/>

  <!-- app icon -->
  <rect x="182" y="90" width="36" height="36" rx="10" fill="#34D399"/>
  <text x="200" y="115" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#0F172A">S</text>

  <text x="200" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#E2E8F0">Smart Budget</text>

  <text x="200" y="262" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">FLUTTER - FINANCE APP</text>
</svg>